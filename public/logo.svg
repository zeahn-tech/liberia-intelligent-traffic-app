<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2d2d5e"/>
    </linearGradient>
  </defs>
  <!-- Background shield shape -->
  <path d="M50 5 L85 20 L85 45 C85 70 70 85 50 95 C30 85 15 70 15 45 L15 20 Z" fill="url(#bg)" stroke="#e8c547" stroke-width="1.5"/>
  <!-- Car icon inside shield -->
  <g transform="translate(26, 30)">
    <!-- Car body -->
    <rect x="5" y="16" width="38" height="16" rx="4" fill="#e8c547"/>
    <path d="M10 16 L14 6 L34 6 L38 16" fill="#e8c547" stroke="#1a1a2e" stroke-width="0.8"/>
    <!-- Windows -->
    <rect x="16" y="8" width="8" height="7" rx="1.5" fill="#1a1a2e" opacity="0.6"/>
    <rect x="26" y="8" width="6" height="7" rx="1.5" fill="#1a1a2e" opacity="0.6"/>
    <!-- Headlight -->
    <rect x="40" y="18" width="3" height="4" rx="1" fill="#f5e6a3"/>
    <!-- Tail light -->
    <rect x="3" y="18" width="2" height="4" rx="1" fill="#ef4444"/>
    <!-- Wheels -->
    <circle cx="16" cy="34" r="5" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
    <circle cx="16" cy="34" r="2" fill="#555"/>
    <circle cx="34" cy="34" r="5" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
    <circle cx="34" cy="34" r="2" fill="#555"/>
    <!-- Road line -->
    <line x1="0" y1="40" x2="48" y2="40" stroke="#f5e6a3" stroke-width="0.8" stroke-dasharray="3,3"/>
  </g>
  <!-- AI badge -->
  <circle cx="72" cy="18" r="10" fill="#22c55e" opacity="0.9"/>
  <text x="72" y="21" text-anchor="middle" fill="white" font-size="8" font-weight="bold" font-family="system-ui">AI</text>
</svg>
