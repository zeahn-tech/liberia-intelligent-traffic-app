server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;

    # ── Security headers ──────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ── Service worker (never cache) ──────────────────
    location ~* ^/(service-worker\.js|sw\.js|workbox-.*\.js)$ {
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
        access_log off;
    }

    # ── PWA manifest ──────────────────────────────────
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── Hashed assets (immutable) ─────────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Logo / icons (immutable) ──────────────────────
    location ~* ^/logo- {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Static files ──────────────────────────────────
    location ~* \.(?:svg|png|jpg|jpeg|gif|webp|ico|woff2?|eot|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── SPA routing — all other routes → index.html ──
    location / {
        try_files $uri $uri/ /index.html;

        # HTML can be cached briefly for repeat visits
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── Deny access to dotfiles ──────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
